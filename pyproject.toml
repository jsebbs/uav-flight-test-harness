[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightsim"
version = "0.1.0"
description = "Simulated UAV flight controller and a requirements-traced pytest harness that tests it"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joel Sebastian" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["flightsim"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["flightsim", "conftest"]
